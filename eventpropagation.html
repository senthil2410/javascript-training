<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event-propagation</title>
     <style>
        .hidden
        {
            display: none;
        }
     </style>
</head>
<body>
     <h1>Event-Propagation</h1>

        <button id="playbutton" style="padding: 10px; border: 2px solid black;">Play-Video</button>

        <div class="hidden" id="container">
            <video>
               <source src="https://upload.wikimedia.org/wikipedia/commons/transcoded/a/a7/How_to_make_video.webm/How_to_make_video.webm.720p.vp9.webm">
               <img src="https://www.google.com/imgres?q=wikipedia%20img&imgurl=https%3A%2F%2Fpngimg.com%2Fd%2Fwikipedia_PNG24.png&imgrefurl=https%3A%2F%2Fpngimg.com%2Fimage%2F47158&docid=RY9fMvu_caqRqM&tbnid=Bfq359gCzH-nYM&vet=12ahUKEwi0qcSPyNeOAxXmV2wGHTc2NwMQM3oECBcQAA..i&w=1058&h=1296&hcb=2&ved=2ahUKEwi0qcSPyNeOAxXmV2wGHTc2NwMQM3oECBcQAA" alt="Event-bubbling">
            </video>
        </div>

        <script>
            const playbutton=document.getElementById("playbutton");
            const container=document.getElementById('container');
            const video=document.querySelector("video");


            playbutton.addEventListener("click",()=>container.classList.remove("hidden"));
            video.addEventListener("click", (event) => {
            event.stopPropagation();
            video.play();
            });

            container.addEventListener("click",()=>container.classList.add("hidden"));
        </script>
       
</body>
</html>
