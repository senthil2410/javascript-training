<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronous-approach</title>
</head>
<body>
    <h1>Synchronous-approach</h1>
    <input type="number" value="10000000" id="userInput" placeholder="Enter the number">
    <button type="button">Range</button>

    <pre id="context" style="display: none;"></pre>

    <p id="output"></p>
</body>

<script>
    const button=document.querySelector("button");
    const input=document.getElementById("userInput");
    const content=document.getElementById("context");

     const oddnumber=[];
      function isOddNumber(start,end)
     {
          for (let i=start;i<end;i++)
          {
             if(i%2===0)
             {
                continue;
             }
             else
             {
                oddnumber.push(i);
             }
          }
     }

     button.addEventListener("click",()=>
     {
        const inputvalue=input.value;
         isOddNumber(1,inputvalue);
         content.innerText=`${oddnumber} \t`;
         
         document.getElementById("output").textContent="Progarm getting finished";
     })

</script>
</html>
