<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises Example</title>
</head>
<body>
    <div class="container">
    <h1 style="text-align: center;">Promises Example</h1>
    <input type="number"  min="1" max="50" placeholder="Enter the User ID" id="userid">
    <button  id="fetchuser">Fetch-User</button>
    <pre id="result"></pre>
    </div>

    <script>
        const result=document.getElementById('result');
        document.getElementById('fetchuser').addEventListener("click",()=>
      {
           const id=document.getElementById('userid').value.trim();
         if(!id)
         {
               result.textContent='Enter the valid User ID';
               return;
         }

         fetch(`https://jsonplaceholder.typicode.com/users/${id}`)

         .then(response=>
         {
            if(!response.ok)
           {
                 throw new Error("User nOT fOUND")
           }
           return response.json()
        
         }
         )
      .then(post => {
         result.innerHTML = `
        <h4><strong>Name:</strong> ${post.name}</h4>
        <p><strong>Email:</strong> ${post.email}</p>
        <p><strong>Address:</strong> ${post.address.street}, ${post.address.city}</p>
        <p><strong>Company:</strong> ${post.company.name}</p>`;
      
       })
         .catch(err=>
         {
            result.textContent=err.message;
            console.log(err);
         }
         )
      })
    </script>
</body>
</html>
