<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular Expression</title>
</head>
<body>
    <h1 style="text-align: center;">Regular Expression</h1>

    <form >

        <label for="name">Name</label>
        <input type="text" id="name" name="name" pattern="^(?=.{6,25}$)([A-Z][a-z]+)(\s[A-Z][a-z]*)" required> <br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" pattern="^[A-Z]"
       
    </form>

    <script>

    </script>
    
</body>
</html>
